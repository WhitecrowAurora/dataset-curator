<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>lulynx · 离线工单</title>
<link rel="stylesheet" href="/static/selection.css"><link rel="stylesheet" href="/static/offline-workorders.css">
<script src="/static/execution-form.js" defer></script><script src="/static/dispatch-template.js" defer></script><script src="/static/offline-jobs.js" defer></script><script src="/static/offline-workorders.js" defer></script></head>
<body><main class="wo-main"><header class="wo-header"><div><h1>离线工单</h1><p>查询分包 → 在本页修改分配 → 按成员生成工单</p></div><a href="/">返回调度中心</a></header>
<p id="wo-message" role="status"></p>
<section class="wo-card"><h2>1 · 查询服务器包情况</h2><div class="wo-actions"><label>工作区 <select id="wo-workspace" aria-label="工单工作区"></select></label><button id="wo-query" type="button">查询分包状态</button><button id="wo-more" type="button" disabled>加载更多</button><label>搜索包名 <input id="wo-search" aria-label="搜索工单分包" placeholder="shard-000015"></label></div><p id="wo-count"></p><div class="wo-scroll"><table><thead><tr><th><input type="checkbox" id="wo-all" aria-label="全选可生成工单的分包"></th><th>仓库 / 分包</th><th>缺项</th><th>当前情况</th></tr></thead><tbody id="wo-packages"></tbody></table></div></section>
<section class="wo-card"><h2>2 · 编辑人员分配和配置</h2><p>本页编辑保存在当前浏览器；生成工单前不会占用服务器分包。管理员可以分别修改每位成员的配置。</p><div class="wo-actions"><label>分配成员 <select id="wo-user" aria-label="工单成员"></select></label><button id="wo-add" type="button">把选中分包加入该成员工单</button><button id="wo-clear" type="button">清空当前草稿</button></div><div id="wo-config"></div><div class="wo-actions"><label>画师注入 <select id="wo-artist" aria-label="工单画师注入"><option value="inherit">沿用仓库设置</option><option value="nl">仅 NL</option><option value="tag">仅 TAG</option><option value="both">TAG + NL</option><option value="off">关闭</option></select></label><button id="wo-save-config" type="button">保存当前成员配置</button></div><div class="wo-actions"><label>排序 <select id="wo-sort" aria-label="工单草稿排序"><option value="user">按成员</option><option value="package">按包名</option></select></label></div><div class="wo-scroll"><table><thead><tr><th>成员</th><th>仓库 / 分包</th><th>操作</th></tr></thead><tbody id="wo-draft"></tbody></table></div></section>
<section class="wo-card"><h2>3 · 确认生成每位成员的工单</h2><p id="wo-summary">尚未添加分包。</p><label><input type="checkbox" id="wo-agree"> 已核对成员、分包、模型配置和画师注入；确认向服务器登记这些离线分配。</label><div class="wo-actions"><button id="wo-generate" type="button" class="wo-primary" disabled>登记并生成工单</button><button id="wo-jobs-refresh" type="button">刷新已有工单</button></div><div id="wo-downloads"></div><details><summary>服务器已有离线工单</summary><div id="wo-jobs"></div><button id="wo-jobs-more" type="button" hidden>更多工单</button></details></section>
</main></body></html>
