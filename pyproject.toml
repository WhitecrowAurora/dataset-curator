[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagger"
version = "0.1.0"
description = "Distributed NL+tag annotation pipeline for diffusion training data"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
# NL 推理引擎有两个，各自要装的东西完全不同：
#   vllm     —— 只有 Linux / WSL2 能装（Windows 原生装不上），这里是它的 Python 包
#   llamacpp —— 不需要任何 Python 依赖，只要一个 llama-server.exe
#                （llama.cpp releases 的 Windows CUDA 包，或用 TAGGER_LLAMA_SERVER
#                 指向它）。所以 Windows 成员机不需要装这个 extra。
serve = ["vllm>=0.9.0"]
# parquet 是打包的默认输出格式（Packer.formats 默认 parquet）。
# 写/复核用 pyarrow；**读**分片（本地或 HF）走 datasets 的 streaming——
# 两条路都在这一个 extra 里，否则会出现"能打包、打不了 NL"的半残状态。
parquet = ["pyarrow>=15", "datasets>=2.20"]
# CPU 侧 tag 反推（分类头）。pixai 要 transformers/timm，wd-eva02 要 timm，
# cl-tagger-v2 要 onnxruntime；不装也能跑，只是 tag 得让 VLM 出。
tag = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.45",
    "timm>=1.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "onnxruntime>=1.18",
]
# 本地量化成 GGUF（原始 safetensors → F16 → Q4_K_M/Q6_K）。走 llama.cpp 的
# 官方 convert_hf_to_gguf.py，它要 transformers 读权重；脚本自己 import torch。
# 只要 llama-server 能跑、权重也有现成 GGUF 的机器不用装。
convert = [
    "torch>=2.2",
    "transformers>=4.49",
    "safetensors>=0.4",
]
# W4A16 量化（页面点「开始量化」才会用到）。产物是 compressed-tensors 的
# W4A16，vLLM 能直接加载。量化本身只需要 PyTorch + NVIDIA 显卡，Windows 原生
# 也能跑；但 vLLM 服务只能在 Linux/WSL2，产物目录要能被那一侧读到。
# 只打标不量化的机器不用装。
quantize = [
    "torch>=2.2",
    "transformers>=4.49",
    "llmcompressor>=0.5",
    # compressed-tensors 已从这份清单移除：后端一次都没 import 过它
    # （quantize.py 的 _REQUIRED 也没有它），它只是 llmcompressor 的传递依赖。
    # 显式钉一个自己不用、却和 llmcompressor 版本强耦合的包，只会在升级时
    # 制造"两个都装上了但互相不认"的解析冲突。
    "datasets>=2.20",
    "accelerate>=0.30",
]

[project.scripts]
tagger = "tagger.cli:main"

[tool.setuptools.packages.find]
include = ["tagger*"]

[tool.pytest.ini_options]
# 测试是安全网，不该靠"记得哪个目录"来跑。pytest 直接读这里。
testpaths = ["tests"]
# 只报失败与汇总：全绿时输出越短，越容易在改完代码后顺手跑一遍。
addopts = "-q --strict-markers"
