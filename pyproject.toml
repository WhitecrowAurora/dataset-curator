[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tagger"
version = "0.1.0"
description = "Distributed NL+tag annotation pipeline for diffusion training data"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "Pillow>=10.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# NL 推理引擎有两个，各自要装的东西完全不同：
#   vllm     —— 只有 Linux / WSL2 能装（Windows 原生装不上），这里是它的 Python 包
#   llamacpp —— 不需要任何 Python 依赖，只要一个 llama-server
#                （llama.cpp releases 的预编译包：Windows 是 .zip、Linux 是
#                 .tar.gz，`tagger llama install` 会自动挑并装到
#                 runtime/llama.cpp；也可以用 TAGGER_LLAMA_SERVER 指向现成的一份）。
#                 两个平台的成员机都不需要装这个 extra。
serve = ["vllm>=0.9.0"]
# 专用 Qwen3-VL；sm80+ 优化按需使用 triton / triton-windows。
# V100 / Turing 的 GGUF 加速使用 PyTorch CUDA 随附的 NVRTC，无需 nvcc。
# V100 须安装仍包含 sm_70 的 PyTorch CUDA 12 构建。
native-nl = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers==5.14.1",
    "safetensors>=0.4",
    "gguf>=0.17",
]
# Torii native 的可选 CUDA 加速；不装仍可使用 PyTorch / 默认 llama.cpp。
# 不使用 FLA 的 [cuda] extra，以免 Windows 被拉入 Linux 的 triton 包。
torii-accel = [
    "torch>=2.7",
    "flash-linear-attention==0.6.0",
    "fla-core==0.6.0",
    "einops>=0.8",
    "triton-windows>=3.7.1.post27,<3.8; sys_platform == 'win32'",
    "triton>=3.3,<3.8; sys_platform == 'linux'",
]
# parquet 是打包的默认输出格式（Packer.formats 默认 parquet）。
# 写/复核用 pyarrow；**读**分片（本地或 HF）走 datasets 的 streaming——
# 两条路都在这一个 extra 里，否则会出现"能打包、打不了 NL"的半残状态。
parquet = ["pyarrow>=15", "datasets>=2.20"]
# 训练端精确 token 计数与人工审查偏好学习（CPU）。
review-learning = ["transformers>=4.45", "numpy>=1.26", "pydantic>=2.7"]
# 发色与媒体 ONNX 模型 + Torii HTTP/图像适配；native 引擎使用 native-nl。
hair = [
    "onnxruntime>=1.20",
    "pydantic>=2.7",
    "numpy>=1.26",
    "Pillow>=10",
    "huggingface_hub>=0.24",
    "httpx>=0.27",
    "psutil>=5.9",
]
# CPU 侧 tag 反推（分类头）。pixai 要 transformers/timm，wd-eva02 要 timm，
# cl-tagger-v2 要 onnxruntime；不装也能跑，只是 tag 得让 VLM 出。
tag = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.45",
    "timm>=1.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.24",
    "onnxruntime>=1.18",
]
# 本地量化成 GGUF（原始 safetensors → F16 → Q4_K_M/Q6_K）。走 llama.cpp 的
# 官方 convert_hf_to_gguf.py，它要 transformers 读权重；脚本自己 import torch。
# sentencepiece 不是可选项：Qwen / Llama 这类权重带 tokenizer.model 时，脚本走
# `_set_vocab_sentencepiece`（conversion/base.py:2548），缺了会在读完权重之后
# 才炸 —— 那时候用户已经等了几分钟。
# 只要 llama-server 能跑、权重也有现成 GGUF 的机器不用装。
convert = [
    "torch>=2.2",
    "transformers>=4.49",
    "safetensors>=0.4",
    "sentencepiece>=0.2.0",
]
# W4A16 量化（页面点「开始量化」才会用到）。产物是 compressed-tensors 的
# W4A16，vLLM 能直接加载。量化本身只需要 PyTorch + NVIDIA 显卡，Windows 原生
# 也能跑；但 vLLM 服务只能在 Linux/WSL2，产物目录要能被那一侧读到。
# 只打标不量化的机器不用装。
quantize = [
    "torch>=2.2",
    "transformers>=4.49",
    "llmcompressor>=0.5",
    # compressed-tensors 已从这份清单移除：后端一次都没 import 过它
    # （quantize.py 的 _REQUIRED 也没有它），它只是 llmcompressor 的传递依赖。
    # 显式钉一个自己不用、却和 llmcompressor 版本强耦合的包，只会在升级时
    # 制造"两个都装上了但互相不认"的解析冲突。
    "datasets>=2.20",
    "accelerate>=0.30",
]

[project.scripts]
tagger = "tagger.cli:main"

[tool.setuptools.packages.find]
include = ["tagger*"]

[tool.setuptools.package-data]
"tagger.hair_color" = ["*.jinja"]
"tagger.inference.qwen3vl.kernels.cuda" = ["*.cu"]

[tool.pytest.ini_options]
# 测试是安全网，不该靠"记得哪个目录"来跑。pytest 直接读这里。
testpaths = ["tests"]
# 只报失败与汇总：全绿时输出越短，越容易在改完代码后顺手跑一遍。
addopts = "-q --strict-markers"
