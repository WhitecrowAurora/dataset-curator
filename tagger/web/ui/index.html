<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tagger · NL + tag 打标工作台</title>
    <!--
      首屏先把主题挂上：:root 默认深色，若等 React 挂载后再改 data-theme，
      浅色用户每次打开都会先闪一下深色。口径必须与 src/lib/theme.ts 一致：
      ?theme= 覆盖 > localStorage('tagger-theme') > 深色。
      （这里读不到偏好时什么都不做，正好落回 :root 的深色。）
    -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('theme')
          var theme = q === 'light' || q === 'dark' ? q : localStorage.getItem('tagger-theme')
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme)
          }
        } catch (e) {
          /* 隐私模式 / 禁用存储：保持默认深色即可 */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
